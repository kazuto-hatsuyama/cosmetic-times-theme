name: Deploy to Shopify

# 2026-09-01: pushトリガーを廃止し、手動実行（workflow_dispatch）のみに変更。
# 理由: mainへのマージ・push直後に本番の公開（live）テーマ（cosmetic-times-prd /
# テーマID 138815832273、--allow-live指定）へ自動反映されてしまう挙動が発覚し、
# ユーザーから「今後はmainへのpushだけでは本番liveテーマに自動反映されないように
# してほしい」と明示的な依頼があったための対応。
# 本番へ反映したい場合は、GitHub Actionsの「Run workflow」ボタン、または
# `gh workflow run "Deploy to Shopify" --ref main` で手動実行すること。
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy theme to Shopify
        run: |
          set -eo pipefail
          echo "=== Runtime versions ==="
          node --version
          npm --version
          shopify version
          echo "=== Starting theme push ==="
          shopify theme push \
            --store cosmetic-times-prd.myshopify.com \
            --theme 138815832273 \
            --allow-live \
            --nodelete \
            --verbose
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_CLI_TTY: "0"
          NO_COLOR: "1"
